# Public CI of bussolabs/closeyourit-cli-community (CYRA-914 B8). It runs on GitHub-hosted runners:
# a fork's pull request must never reach the private pool. Releases are cut from the maintainer
# repository, so this workflow only checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm test
